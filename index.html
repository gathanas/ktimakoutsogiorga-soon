<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Couchell Winery — Από τον τόπο των Καρυάτιδων, στις πλαγιές του Πάρνωνα. Εγγραφείτε για να ειδοποιηθείτε όταν λανσάρουμε.">
<link rel="icon" type="image/webp" href="/brand.webp">
<title>Couchell Winery — Coming Soon</title>
<link rel="preload" as="image" href="/background.webp" fetchpriority="high">
<link rel="preload" as="font" type="font/woff2" href="/fonts/lato-300.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-700.woff2" crossorigin>
<link rel="preconnect" href="https://formsubmit.co" crossorigin>
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/playfair-400.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/playfair-700.woff2) format('woff2')}
@font-face{font-family:'Lato';font-style:normal;font-weight:300;font-display:swap;src:url(/fonts/lato-300.woff2) format('woff2');unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:'Lato';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/lato-400.woff2) format('woff2');unicode-range:U+0370-03FF,U+1F00-1FFF}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Lato',system-ui,-apple-system,sans-serif;color:#F5F0E1}
body{display:flex;align-items:center;justify-content:center;background:#4A0E0E url('/background.webp') center/cover no-repeat fixed;position:relative}
.background-overlay{position:fixed;inset:0;background:linear-gradient(135deg,rgba(74,14,14,.85) 0%,rgba(114,47,55,.75) 50%,rgba(74,14,14,.9) 100%);z-index:0}
.container{position:relative;z-index:1;width:100%;padding:1.5rem;display:flex;align-items:center;justify-content:center;min-height:100vh;animation:fadeIn 1.2s ease-out}
.card{background:rgba(74,14,14,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(212,175,55,.25);border-radius:12px;padding:3.5rem 3rem;max-width:520px;width:100%;text-align:center}
.brand{font-family:'Playfair Display',serif;font-size:1rem;letter-spacing:.25em;text-transform:uppercase;color:#D4AF37;margin-bottom:.75rem}
.heading{font-family:'Playfair Display',serif;font-size:3rem;font-weight:700;line-height:1.15;margin-bottom:1.25rem;color:#F5F0E1}
.tagline{font-weight:300;font-size:1.05rem;line-height:1.7;color:rgba(245,240,225,.85);margin-bottom:2rem}
.signup{display:flex;gap:.5rem}
.email-input{flex:1;padding:.85rem 1rem;border:1px solid rgba(212,175,55,.35);border-radius:6px;background:rgba(245,240,225,.1);color:#F5F0E1;font-family:'Lato',system-ui,-apple-system,sans-serif;font-size:.95rem;outline:none;transition:border-color .2s}
.email-input::placeholder{color:rgba(245,240,225,.5)}
.email-input:focus{border-color:#D4AF37}
.notify-btn{padding:.85rem 1.5rem;border:none;border-radius:6px;background:#D4AF37;color:#4A0E0E;font-family:'Lato',system-ui,-apple-system,sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s}
.notify-btn:hover{background:#c19b2e}
.confirmation{color:#D4AF37;font-size:1rem;margin-top:1rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:768px){.card{padding:2.5rem 2rem}.heading{font-size:2.4rem}}
@media (max-width:480px){.card{padding:2rem 1.25rem;border-radius:8px}.heading{font-size:2rem}.tagline{font-size:.95rem}.signup{flex-direction:column}.notify-btn{width:100%}}
</style>
</head>
<body>
<div class="background-overlay"></div>
<main class="container">
<div class="card">
<p class="brand">Couchell Winery</p>
<h1 class="heading">Coming Soon</h1>
<p class="tagline">Από τον τόπο των Καρυάτιδων, στις πλαγιές του Πάρνωνα, κάτι που αξίζει την αναμονή έρχεται σύντομα...</p>
<div id="signup-slot">
<form class="signup" id="signup-form" action="https://formsubmit.co/couchellwinery@gmail.com" method="POST">
<input type="email" name="email" class="email-input" placeholder="Εισάγετε το email σας" required aria-label="Διεύθυνση email">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Couchell Winery signup!">
<button type="submit" class="notify-btn">Ειδοποιήστε με</button>
</form>
</div>
</div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
